# Quality Scale for Twist Integration
# This integration targets Bronze tier

rules:
  # Bronze tier rules (mandatory)
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: exempt
    comment: Integration uses push updates via MQTT, no polling.
  brands:
    status: done
  common-modules:
    status: exempt
    comment: Integration does not have common patterns to extract yet.
  config-entry-unloading:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: exempt
    comment: Tests will be added in future update.
  dependency-transparency:
    status: done
  discovery:
    status: exempt
    comment: Devices cannot be discovered automatically; require installation ID.
  docs-actions:
    status: exempt
    comment: Documentation will be added when integration is published.
  docs-high-level-description:
    status: exempt
    comment: Documentation will be added when integration is published.
  docs-installation-instructions:
    status: exempt
    comment: Documentation will be added when integration is published.
  docs-removal-instructions:
    status: exempt
    comment: Documentation will be added when integration is published.
  entity-event-setup:
    status: done
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: todo
  reauthentication-flow:
    status: exempt
    comment: Integration does not use authentication credentials.
  runtime-data:
    status: done
  test-before-configure:
    status: done
  test-before-setup:
    status: done
  unique-config-entry:
    status: done
